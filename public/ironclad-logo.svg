<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2530"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#48BB78"/>
      <stop offset="50%" stop-color="#3B945E"/>
      <stop offset="100%" stop-color="#276749"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6E05E"/>
      <stop offset="100%" stop-color="#D69E2E"/>
    </linearGradient>
  </defs>

  <!-- Industrial Emblem / Shield -->
  <g transform="translate(10, 10)">
    <!-- Base Shield -->
    <path d="M 40 4 L 72 16 L 72 48 C 72 68 40 78 40 78 C 40 78 8 68 8 48 L 8 16 Z" fill="url(#shieldGrad)" stroke="#3B945E" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Floor Layer Tiles / Isometric Grid Accent -->
    <polygon points="40,16 62,28 40,40 18,28" fill="url(#emeraldGrad)" opacity="0.95"/>
    <polygon points="18,32 40,44 40,64 18,52" fill="#2D3748" opacity="0.9"/>
    <polygon points="62,32 62,52 40,64 40,44" fill="#3B945E" opacity="0.85"/>
    
    <!-- Diamond Highlight -->
    <polygon points="40,24 50,30 40,36 30,30" fill="#E2E8F0" opacity="0.75"/>
    <circle cx="40" cy="30" r="2.5" fill="#88D2A8"/>
  </g>

  <!-- Typography -->
  <text x="96" y="44" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="900" letter-spacing="1.5" fill="#0F172A">
    IRONCLAD
  </text>
  
  <text x="97" y="66" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="3.5" fill="#3B945E">
    COMMERCIAL FLOORS
  </text>

  <rect x="97" y="74" width="280" height="2" fill="#3B945E" opacity="0.3"/>
</svg>
